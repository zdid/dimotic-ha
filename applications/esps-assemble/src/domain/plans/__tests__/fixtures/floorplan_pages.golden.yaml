    id: ha_original_light_lumiere_plafonnier_chambre_de_jo_1er_etage
    entity_id: light.lumiere_plafonnier_chambre_de_jo_1er_etage
    internal: true
    on_value:
      - lvgl.label.update:
          id: icon_original_light_lumiere_plafonnier_chambre_de_jo_1er_etage
