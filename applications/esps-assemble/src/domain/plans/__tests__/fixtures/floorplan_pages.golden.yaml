# Généré par generate_esphome_floorplan.py --- 3 plan(s) : original, Rez de chaussée, Premier
# Images de fond ci-dessous (voir image:) — à copier dans le dossier du projet ESPHome.
# Police d'icônes : fa-solid-900.ttf (voir fonts/, à copier aussi dans le dossier du projet ESPHome)

image:
  - file: "floorplan_original_800x480.png"
    id: floorplan_bg_original
    type: RGB565
  - file: "floorplan_rez_de_chauss_e_800x480.png"
    id: floorplan_bg_rez_de_chauss_e
    type: RGB565
  - file: "floorplan_premier_800x480.png"
    id: floorplan_bg_premier
    type: RGB565

font:
  - file: "fa-solid-900.ttf"
    id: font_icons
    size: 20
    glyphs: ["\uf043", "\uf05a", "\uf06d", "\uf0e7", "\uf0eb", "\uf204", "\uf205", "\uf2c9", "\uf2d0", "\uf2d1", "\uf2dc", "\uf3fd", "\uf72e", "\uf773"]
  - file: "fa-solid-900.ttf"
    id: font_nav
    size: 40
    glyphs: ["\uf053", "\uf054"]
  - file: "gfonts://Roboto"
    id: font_sensor
    size: 20
    glyphs: "0123456789.-"

text_sensor:
