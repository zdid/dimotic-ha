# Fiche de l'appareil haplan-display (un exemplaire physique). Adresse fixe 192.168.1.115 : le poseur (dans un conteneur Docker) ne résout pas les noms en .local ; à fixer par réservation DHCP.
nom: haplan-display
nom_affichage: "Plan HAPLAN"
materiel: sunton-8048s070c
esp:
  adresse: "192.168.1.115"
options:
  autoriser_appels_service: true
wifi: [stfort]
plans: ["Maison à plat", "Maison paysage", Maison, "Rez de chaussée", Premier]
tailles_plans: { texte: 17, valeur: 17, icone: 17 }
fond_plans: noir
reglages_plans: true
thermometres_clim:
  - { climat: climate.153931629788358_climate, thermometre: sensor.salle_temperature }   # clim de la salle (plafond) -> thermomètre de la salle
