    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_rez_de_chauss_e_sensor_barometre_salle_de_bain_du_bas_salle_de_bain_du_bas_rez_de_chaussee_humidity
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", x);
            return std::string(buf);
