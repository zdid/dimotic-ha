# Élément : page « énergie en direct » de l'écran (LVGL 800x480), avec les capteurs HA, images et polices qu'elle seule utilise.
# Reclassé le 13/10/2026 depuis pages/energie-direct.yaml (phase 1).

font:
  - file: "fa-solid-900.ttf"
    id: font_energy_icons
    size: 34
    glyphs: ["\uf185", "\uf0e7", "\uf015", "\uf241"]
  - file: "fa-solid-900.ttf"
    id: font_energy_arrow
    size: 30
    glyphs: ["\uf061", "\uf060", "\uf062", "\uf063"]
  - file: "gfonts://Roboto"
    id: font_energy_value
    size: 26
    glyphs: "0123456789.-WkV% "
  - file: "gfonts://Roboto"
    id: font_energy_text
    size: 20
    glyphs: " -ABCDMRSVacdeghilnoprstuÉé"
sensor:
  - platform: homeassistant
    id: ha_energie_solar
    entity_id: sensor.emma_puissance_de_sortie_des_panneaux
    internal: true
    on_value:
      - logger.log:
          format: "energie solar = %.1f"
          args: ['x']
      - lvgl.label.update:
          id: energie_valeur_solar
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            if (fabsf(x) >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", fabsf(x) / 1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", fabsf(x));
            return std::string(buf);
      - lvgl.label.update:
          id: energie_fleche_solar
          text: !lambda 'return x > 10.0f ? std::string("\xef\x81\xa3") : std::string("");'
  - platform: homeassistant
    id: ha_energie_grid
    entity_id: sensor.emma_puissance_active
    internal: true
    on_value:
      - logger.log:
          format: "energie grid = %.1f"
          args: ['x']
      - lvgl.label.update:
          id: energie_valeur_grid
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            if (fabsf(x) >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", fabsf(x) / 1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", fabsf(x));
            return std::string(buf);
      - lvgl.label.update:
          id: energie_fleche_grid
          text: !lambda 'return x > 10.0f ? std::string("\xef\x81\xa1") : (x < -10.0f ? std::string("\xef\x81\xa0") : std::string(""));'
      - lvgl.label.update:
          id: energie_legende_grid
          text: !lambda 'return x > 10.0f ? std::string("Achat") : (x < -10.0f ? std::string("Vente") : std::string("Réseau"));'
  - platform: homeassistant
    id: ha_energie_home
    entity_id: sensor.emma_puissance_de_soutiree
    internal: true
    on_value:
      - logger.log:
          format: "energie home = %.1f"
          args: ['x']
      - lvgl.label.update:
          id: energie_valeur_home
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            if (fabsf(x) >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", fabsf(x) / 1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", fabsf(x));
            return std::string(buf);
      - lvgl.label.update:
          id: energie_fleche_home
          text: !lambda 'return x > 10.0f ? std::string("\xef\x81\xa1") : std::string("");'
  - platform: homeassistant
    id: ha_energie_battery
    entity_id: sensor.batteries_puissance_de_charge_decharge
    internal: true
    on_value:
      - logger.log:
          format: "energie battery = %.1f"
          args: ['x']
      - lvgl.label.update:
          id: energie_valeur_battery
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            if (fabsf(x) >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", fabsf(x) / 1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", fabsf(x));
            return std::string(buf);
      - lvgl.label.update:
          id: energie_fleche_battery
          text: !lambda 'return x > 10.0f ? std::string("\xef\x81\xa3") : (x < -10.0f ? std::string("\xef\x81\xa2") : std::string(""));'
      - lvgl.label.update:
          id: energie_legende_battery
          text: !lambda 'return x > 10.0f ? std::string("Charge") : (x < -10.0f ? std::string("Décharge") : std::string("Repos"));'
  - platform: homeassistant
    id: ha_energie_soc
    entity_id: sensor.batteries_etat_de_la_capacite
    internal: true
    on_value:
      - lvgl.label.update:
          id: energie_soc
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[12];
            snprintf(buf, sizeof(buf), "%.0f %%", x);
            return std::string(buf);
