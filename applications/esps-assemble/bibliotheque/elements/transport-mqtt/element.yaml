# Élément : transport MQTT — voir fiche.yaml. À la place du bloc `api:` (un seul transport, contrôlé à l'assemblage).
substitutions:
  prefixe_decouverte: homeassist
  prefixe_sujet: esphome/${device_name}

# ⭐ 12/11/2026 (assembleur v1.8) — broker DU SITE généré à l'assemblage (paramètre MQTT général de dimotic-ha) ;
# une fiche peut le remplacer en passant `broker` / `port_broker` dans ses vars.
packages:
  site: !include ../../../generes/site.yaml

mqtt:
  broker: ${broker}
  port: ${port_broker}
  discovery: true
  discovery_prefix: ${prefixe_decouverte}
  topic_prefix: ${prefixe_sujet}
  # unique_id = adresse MAC + type + hash du NOM DE L'ENTITÉ : unique par appareil. Sans cela (« ESP<type><nom> »), deux appareils dont
  # l'entité principale s'appelle « Switch » auraient le même unique_id et HA les confondrait (constaté au banc d'essai).
  discovery_unique_id_generator: mac
  reboot_timeout: 0s     # le relais ne doit pas retomber à cause d'une coupure de MQTT
