# Gabarits de phrase de l'interpréteur déterministe (voir specs/current/fonctionnelles-ia_specs
# §16 et le plan de mise en œuvre — "Notation des gabarits"). Modèle versionné, copié vers
# data/ia/gabarits_interpreteur.yaml au premier démarrage si absent (éditable à chaud ensuite, voir
# vocabulaire.yaml pour la même convention).
#
# STATUT (26/08/2026, suite) : `jusqua`/`de` fusionnés dans `a` (mêmes alternatives de surface que
# le legacy — "à"/"jusqu'à"/"au"/"jusqu'au"), `entre` (fenêtre, trigger.type=window), `donne`
# (interrogation, type_sortie=request), l'exclusion `sauf <lieu>*` (intégrée à `ordre_immediat`,
# pas un gabarit séparé) et `soleil` (lever/coucher, trigger.type=sun, calcul réel via `suncalc`
# côté `planificateur` — pas une simple lecture de `sun.sun` de HA, qui ne donne que le PROCHAIN
# lever/coucher, insuffisant dès qu'un filtre de jours type "tous les week-ends" est combiné) sont
# maintenant couverts. **Reste volontairement hors périmètre** — `delayrepeat` ("toutes les X") :
# `trigger.every` existe dans `triggerSchema` mais n'est lu nulle part dans
# `scheduler.ts::triggerToMs` (champ descriptif, pas fonctionnel) — l'implémenter demanderait
# d'abord de câbler un vrai mécanisme d'intervalle répétitif côté `planificateur`, pas seulement
# d'ajouter un gabarit ici.

gabarits:
  # --- Ordres (typePhrase "ordre" legacy) ---------------------------------------------------

  ordre_immediat:
    pattern: "<verbe:on_off> <enum:tous#lieux>? <quoi>? <lieu#lieux>* (sauf <lieu#lieuxsauf>*)?"
    strict: false
    type_sortie: ordre
    defaults:
      quoi: lumiere

  ordre_valeur:
    pattern: "<verbe:valeur> <quoi>? <lieu#lieux>* (a|à)? <valeur>"
    strict: false
    type_sortie: ordre
    defaults:
      quoi: thermostat

  # --- Fragments de planification (typePhrase "planif" legacy, composables) ----------------

  dans:
    pattern: "dans <duree>"
    strict: true
    type_sortie: planif_fragment

  attendre:
    pattern: "attendre <duree>"
    strict: true
    type_sortie: planif_fragment

  # Fusionne jusqua/a/de du legacy — mêmes alternatives de surface que le "a" original
  # (`["a","jusqu a", "au", "jusqu au"]`), "de" traité comme une fenêtre via le gabarit `entre`
  # plutôt que composé séparément (voir note de statut en tête de fichier).
  a:
    pattern: "(a|à|jusqu a|au|jusqu au) <heure>"
    strict: true
    type_sortie: planif_fragment

  entre:
    pattern: "entre <heure#from> et <heure#to>"
    strict: true
    type_sortie: planif_fragment

  # Lever/coucher de soleil, avec décalage optionnel avant/après (26/08/2026, demande utilisateur —
  # calcul réel via suncalc côté planificateur, voir fonctionnelles-planificateur_specs pour le
  # trigger.type=sun correspondant ; ne se contente PAS de lire sun.sun de HA, qui ne donne que le
  # prochain lever/coucher, insuffisant pour un filtre de jours type "tous les week-ends").
  soleil:
    pattern: "(<duree#offset> <enum:avant_apres#direction>)? (au|a|à)? <enum:lever_coucher#sunevent>"
    strict: true
    type_sortie: planif_fragment

  donne:
    pattern: "<verbe:request> (l etat|les etats)? <quoi>? <lieu#lieux>*"
    strict: false
    type_sortie: request

  pendant:
    pattern: "pendant <duree> (a <duree#duration2>)?"
    strict: true
    type_sortie: planif_fragment

  touslesjours:
    pattern: "tous les jours <enum:jours_ouvres#jours>? (sauf (<enum:jour#jourssauf>*|<enum:week_end#jourssauf>))?"
    strict: true
    type_sortie: planif_fragment

  touslesjourssemaine:
    pattern: "tous les <enum:jour#jours>*"
    strict: false
    type_sortie: planif_fragment

  leweekend:
    pattern: "<enum:week_end#jours>"
    strict: true
    type_sortie: planif_fragment

  # --- Gabarit événementiel (absent du legacy, demande explicite utilisateur, §16.8) --------

  si_alors:
    pattern: "si <quoi#trigger_quoi>? <lieu#trigger_lieu>* <enum:etat_on_off#trigger_etat> (alors|,) <gabarit:ordre_immediat>"
    strict: false
    type_sortie: evenement
