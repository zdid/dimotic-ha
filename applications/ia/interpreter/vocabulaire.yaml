# Vocabulaire de l'interpréteur déterministe (voir specs/current/fonctionnelles-ia_specs §16).
#
# Modèle versionné dans le dépôt — copié vers data/ia/vocabulaire_interpreteur.yaml au premier
# démarrage si absent, puis c'est CE fichier-là (sous data/) qui fait foi et qui est éditable à
# chaud sans reconstruire l'application. Modifier ce fichier-ci ne change rien à une installation
# déjà démarrée une fois.

# Groupes de verbes. `<verbe:on_off>` (dans un gabarit) matche N'IMPORTE LEQUEL des verbes du
# groupe "on_off" et capture son nom canonique (pas le nom du groupe) — mirror volontaire des clés
# de applications/planificateur/src/domain/resolution.ts::ON_OFF_TOGGLE_VERBS/VALUE_VERBS (pas un
# import croisé entre applications, chacune reste autonome).
verbeGroupes:
  on_off:
    allumer: [allume, allumes, allumer, allumez]
    activer: [active, actives, activer, activez]
    ouvrir: [ouvre, ouvres, ouvrir, ouvrez]
    eteindre: [eteins, eteint, eteignez, eteindre]
    desactiver: [desactive, desactives, desactiver, desactivez]
    fermer: [ferme, fermes, fermez, fermer]
    basculer: [bascule, bascules, basculer, basculez]
  valeur:
    regler: [regle, regles, regler, mets, met, mettre, chauffe, chauffer, chauffez]
    baisser: [baisse, baisses, baisser, baissez, descend, descends, descendez, descendre, diminue, diminues, diminuer]
    augmenter: [monte, montes, monter, montez, augmente, augmentes, augmentez, augmenter]

# Tables <enum:X> : chaque entrée associe une ou plusieurs formes de surface à une valeur capturée
# fixe (scalaire ou liste) — jamais le texte littéralement matché.
enums:
  lever_coucher:
    - formes: ["lever du soleil", "le lever du soleil"]
      valeur: lever
    - formes: ["coucher du soleil", "le coucher du soleil"]
      valeur: coucher
  tous:
    - formes: [tous, tout, toute, toutes]
      valeur: [tous]
  jours_ouvres:
    - formes: ["en semaine", "ouvres", "ouvre", "travailles"]
      valeur: [lundi, mardi, mercredi, jeudi, vendredi]
  week_end:
    - formes: ["le week end", "week end", "le week-end", "week-end"]
      valeur: [samedi, dimanche]
  jour:
    - formes: [lundi, lundis]
      valeur: lundi
    - formes: [mardi, mardis]
      valeur: mardi
    - formes: [mercredi, mercredis]
      valeur: mercredi
    - formes: [jeudi, jeudis]
      valeur: jeudi
    - formes: [vendredi, vendredis]
      valeur: vendredi
    - formes: [samedi, samedis]
      valeur: samedi
    - formes: [dimanche, dimanches]
      valeur: dimanche
  # Vocabulaire verbe-d'état du gabarit si_alors (§16.8) — limité à on/off en v1, valeurs alignées
  # sur `resolution.ts::ON_OFF_TOGGLE_VERBS` côté service (turn_on/turn_off).
  etat_on_off:
    - formes: ["s allume", "s allument", "allumee", "allumees"]
      valeur: "on"
    - formes: ["s eteint", "s eteignent", "eteinte", "eteintes"]
      valeur: "off"
    - formes: ["s ouvre", "s ouvrent", "ouverte", "ouvertes"]
      valeur: "on"
    - formes: ["se ferme", "se ferment", "fermee", "fermees"]
      valeur: "off"

# Mots sautés automatiquement pendant le matching non strict (articles + connecteurs) — port de
# `motsignorables` (interpretetext.js:55).
motsIgnores: [le, la, les, de, d, l, des, et, du, un, une]

# Séparateurs de phrase (voir plan — "et" seul volontairement exclu, trop ambigu). "." est toujours
# traité séparément (protection des décimaux, voir tokenizer.ts) et n'a pas besoin de figurer ici.
separateurs: [";", "puis", "ensuite", "et puis", "et ensuite"]
