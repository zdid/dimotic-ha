            snprintf(buf, sizeof(buf), "%dh%02d", t / 60, t % 60);
            return std::string(buf);
  - platform: homeassistant
    id: ha_ballons_puissance_petit
    entity_id: sensor.petit_ballon_maison_maison_rez_de_chaussee_power
