# Page LVGL « page_ballons_chauffe » — élément de bibliothèque espdisplay (extrait de haplan-display.yaml le 12/10/2026).
# Contient la page et les capteurs HA, images et polices qu'elle seule utilise.

font:
  - file: "fa-solid-900.ttf"
    id: font_ballons_icon
    size: 40
    glyphs: ["\uf773", "\uf06d"]
  - file: "gfonts://Roboto"
    id: font_ballons_title
    size: 24
    glyphs: " -0123456789:ACEGIMNOPSUabcdefhilmnoprstu«»éê"
  - file: "gfonts://Roboto"
    id: font_ballons_text
    size: 20
    glyphs: " -0123456789:ACEGIMNOPSUabcdefhilmnoprstu«»éê"
  - file: "gfonts://Roboto"
    id: font_ballons_value
    size: 40
    glyphs: "0123456789.-WkV% "
text_sensor:
  - platform: homeassistant
    id: ha_ballons_cmd_gros
    entity_id: switch.gros_ballon_maison_maison_rez_de_chaussee
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_commande_gros
          text: !lambda 'return x == "on" ? std::string("Marche") : std::string("Arrêt");'
  - platform: homeassistant
    id: ha_ballons_chauffe_gros
    entity_id: binary_sensor.gros_ballon_en_chauffe
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_chauffe_gros
          text: !lambda 'return x == "on" ? std::string("Oui") : std::string("Non");'
      - lvgl.label.update:
          id: ballons_icone_gros
          text: !lambda 'return x == "on" ? std::string("\xef\x81\xad") : std::string("\xef\x9d\xb3");'
          text_color: !lambda 'return x == "on" ? lv_color_hex(0xFF5722) : lv_color_hex(0x2196F3);'
  - platform: homeassistant
    id: ha_ballons_cmd_petit
    entity_id: switch.petit_ballon_maison_maison_rez_de_chaussee
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_commande_petit
          text: !lambda 'return x == "on" ? std::string("Marche") : std::string("Arrêt");'
  - platform: homeassistant
    id: ha_ballons_chauffe_petit
    entity_id: binary_sensor.petit_ballon_en_chauffe
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_chauffe_petit
          text: !lambda 'return x == "on" ? std::string("Oui") : std::string("Non");'
      - lvgl.label.update:
          id: ballons_icone_petit
          text: !lambda 'return x == "on" ? std::string("\xef\x81\xad") : std::string("\xef\x9d\xb3");'
          text_color: !lambda 'return x == "on" ? lv_color_hex(0xFF5722) : lv_color_hex(0xFF9800);'
  - platform: homeassistant
    id: ha_ballons_btn_premier
    entity_id: input_boolean.petit_ballon_en_premier
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_btn_premier
          text: !lambda 'return x == "on" ? std::string("En premier : Petit ballon") : std::string("En premier : Gros ballon");'
      - lvgl.widget.update:
          id: ballons_btn_premier
          border_color: !lambda 'return x == "on" ? lv_color_hex(0x4CAF50) : lv_color_hex(0x666666);'
  - platform: homeassistant
    id: ha_ballons_btn_unique
    entity_id: input_boolean.un_seul_ballon
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_btn_unique
          text: !lambda 'return x == "on" ? std::string("Un seul ballon : OUI") : std::string("Un seul ballon : NON");'
      - lvgl.widget.update:
          id: ballons_btn_unique
          border_color: !lambda 'return x == "on" ? lv_color_hex(0x4CAF50) : lv_color_hex(0x666666);'
sensor:
  - platform: homeassistant
    id: ha_ballons_puissance_gros
    entity_id: sensor.gros_ballon_maison_maison_rez_de_chaussee_power
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_puissance_gros
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            if (fabsf(x) >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", x / 1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);
  - platform: homeassistant
    id: ha_ballons_duree_on_gros
    entity_id: sensor.maison_gros_ballon_duree_sur_on_aujourd_hui
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_duree_on_gros
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            int t = (int) roundf(x * 60.0f);
            char buf[12];
            snprintf(buf, sizeof(buf), "%dh%02d", t / 60, t % 60);
            return std::string(buf);
  - platform: homeassistant
    id: ha_ballons_duree_chauffe_gros
    entity_id: sensor.gros_ballon_duree_de_chauffe_aujourd_hui
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_duree_chauffe_gros
