            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);
  - platform: homeassistant
    id: ha_ballons_duree_on_petit
    entity_id: sensor.maison_petit_ballon_duree_sur_on_aujourd_hui
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_duree_on_petit
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            int t = (int) roundf(x * 60.0f);
            char buf[12];
            snprintf(buf, sizeof(buf), "%dh%02d", t / 60, t % 60);
            return std::string(buf);
  - platform: homeassistant
    id: ha_ballons_duree_chauffe_petit
    entity_id: sensor.petit_ballon_duree_de_chauffe_aujourd_hui
    internal: true
    on_value:
      - lvgl.label.update:
          id: ballons_val_duree_chauffe_petit
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            int t = (int) roundf(x * 60.0f);
            char buf[12];
            snprintf(buf, sizeof(buf), "%dh%02d", t / 60, t % 60);
            return std::string(buf);
