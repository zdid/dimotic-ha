# Élément : wifi à PLUSIEURS réseaux + POINT D'ACCÈS DE SECOURS avec portail captif (comme le WiFiManager de Tasmota).
# conception-esphome-assembleur_specs §3.8. Paramètre : device_name (nom du point d'accès de secours).
# Interchangeable avec elements/wifi-simple : une seule ligne à changer dans le fichier de l'appareil. Les réglages propres
# à une carte (id, économie d'énergie, délai de redémarrage) restent dans sa base.
#
# - L'ESP se connecte au meilleur réseau CONNU qu'il voit (priorité la plus haute d'abord).
# - Si aucun n'est joignable après `ap_timeout`, il ouvre le wifi « <appareil> secours » : s'y connecter depuis un téléphone,
#   la page du portail captif permet de saisir le wifi du nouvel endroit, que l'ESP enregistre.
# - Réseaux : un par site, secrets `wifi_<site>_ssid` / `wifi_<site>_password` dans le secrets.yaml de la machine ESPHome
#   (le site d'assemblage, Saint Fort, garde les noms historiques wifi_ssid / wifi_password). L'assembleur écrira cette
#   liste d'après les sites de l'appareil ; en attendant, décommenter / ajouter les réseaux d'un autre site.
# - Secret à créer : `wifi_secours_password` (8 caractères au moins), mot de passe du point d'accès de secours.
# - ESPHome ajoute de lui-même une mise à jour par la page web du portail (protégée par le mot de passe du point d'accès).

wifi:
  networks:
    - ssid: !secret wifi_ssid          # Saint Fort (site d'assemblage)
      password: !secret wifi_password
      priority: 10
    # - ssid: !secret wifi_noisy_ssid  # noisy (site de destination) : priorité plus haute si l'appareil y est installé
    #   password: !secret wifi_noisy_password
    #   priority: 20
  ap:
    ssid: "${device_name} secours"
    password: !secret wifi_secours_password
    ap_timeout: 1min

captive_portal:
