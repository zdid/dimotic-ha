# Élément : wifi simple (un seul réseau, connexion rapide) — comportement historique des satellites, extrait fidèlement
# de hasat4.yaml le 13/10/2026. Fournit : wifi_id. Interchangeable avec elements/wifi-multi-ap (plusieurs réseaux +
# point d'accès de secours) : une seule ligne à changer dans le fichier de l'appareil.

substitutions:

  hidden_ssid: "false"

wifi:
  id: wifi_id
  fast_connect: ${hidden_ssid}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # Disable power saving for better performance
  reboot_timeout: 10min  # Prevent unnecessary reboots
