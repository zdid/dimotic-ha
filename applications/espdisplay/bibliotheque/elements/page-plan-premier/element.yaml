sensor:
  - platform: homeassistant
    id: ha_premier_sensor_barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_humidity
    entity_id: sensor.barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_premier_sensor_barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_humidity
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", x);
            return std::string(buf);
  - platform: homeassistant
    id: ha_premier_sensor_barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_temperature
    entity_id: sensor.barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_premier_sensor_barometre_salle_de_bain_du_haut_salle_de_bain_du_haut_1er_etage_temperature
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", x);
            return std::string(buf);
