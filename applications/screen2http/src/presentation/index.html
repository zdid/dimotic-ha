<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console screen</title>

  <link rel="stylesheet" href="/applications/screen2http/presentation/vendor/xterm.css">

  <style>
    html, body { margin: 0; background: #111; }
    /* Présentation de l'outil d'origine (zdid/screen2http) : bandeau titre sombre de 42 px + terminal
       plein cadre. Les choix (session, connexion) et l'état s'affichent dans le bandeau. */
    .s2h-root {
      display: flex; flex-direction: column; height: 100vh; background: #111;
      font-family: Arial, sans-serif; color: white;
    }
    /* Injectée dans l'application hôte (Shadow DOM) : hauteur moins le cadre de l'hôte. */
    .s2h-root.embedded { height: calc(100vh - 130px); min-height: 360px; border-radius: 6px; overflow: hidden; }

    .s2h-header {
      height: 42px; flex: none; display: flex; align-items: center; padding: 0 12px; gap: 15px;
      background: #222; color: white;
    }
    .s2h-back {
      margin-left: -4px; width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center;
      border-radius: 4px; color: white; text-decoration: none; font-size: 20px; line-height: 1;
    }
    .s2h-back:hover { background: #444; }
    .s2h-status { color: #aaa; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s2h-status.connected { color: #6c6; }
    .s2h-status.error { color: #e66; }
    .s2h-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .s2h-header select, .s2h-header button {
      height: 28px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;
      font-size: 13px; padding: 0 10px;
    }
    .s2h-header button { cursor: pointer; }
    .s2h-header button:disabled { opacity: 0.45; cursor: not-allowed; }
    .s2h-header select:disabled { opacity: 0.6; }

    .s2h-terminal { flex: 1; min-height: 0; padding: 5px; }
    .s2h-terminal .xterm { height: 100%; }
  </style>
</head>
<body>
  <div class="s2h-root" id="s2h-root">
    <header class="s2h-header">
      <a class="s2h-back" href="/" title="Retour à la page principale et son menu" aria-label="Retour">←</a>
      <strong>Console screen</strong>
      <span class="s2h-status" id="s2h-state">Démarrage...</span>
      <div class="s2h-actions">
        <select id="s2h-target" aria-label="Session screen"></select>
        <button id="s2h-connect">Connecter</button>
        <button id="s2h-disconnect" disabled>Déconnecter</button>
      </div>
    </header>
    <div class="s2h-terminal" id="s2h-terminal"></div>
  </div>

  <script type="module" src="/applications/screen2http/presentation/ts/app.js"></script>

  <!-- Derniere modification: 2026-10-07 16:35:00 - Flèche de retour à gauche du bandeau ; présentation de l'outil d'origine : bandeau titre avec choix de session, Connecter/Déconnecter et état ; terminal plein cadre -->
</body>
</html>
