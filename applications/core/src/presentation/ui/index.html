<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HA WS/MQTT Application - Configuration Interface">
  <title>HA/MQTT</title>
  <link rel="icon" type="image/png" href="/images/maisonsouriante.png">
  <!-- Derniere modification: 2026-09-29 19:35:54 - Diffusion : deux cases (Diffuser / Recevoir), dans la boîte Site -->
  
  <!-- Styles - Chargés depuis des fichiers externes -->
  <link rel="stylesheet" href="/styles/general.css">
  <link rel="stylesheet" href="/styles/alert-banner.css">
  <link rel="stylesheet" href="/styles/config-form.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <!-- ====================================================================== -->
  <!-- BARRE LATÉRALE -->
  <!-- ====================================================================== -->
  <app-sidebar></app-sidebar>

  <!-- ====================================================================== -->
  <!-- CONTENU PRINCIPAL -->
  <!-- ====================================================================== -->
  <main class="main-content">
    <!-- Sections de contenu - masquées par défaut -->
    <div id="section-machine" class="content-section" style="display: none;">
      <!-- ⭐ 29/09/2026 (demande utilisateur) : la diffusion se règle sur la page Site, dans la même
           boîte que la machine (projetée dans la carte du formulaire, voir ConfigForm <slot>). -->
      <app-config-form data-section="machine"><app-diffusion-manager></app-diffusion-manager></app-config-form>
    </div>

    <!-- ⭐ 06/10/2026 : « Paramètres généraux » — Web-services, MQTT, Serveur Web et Journalisation sur UNE page, une
         sauvegarde par section (ConfigForm, data-section="tech"). Ce conteneur sert aussi de support au formulaire de
         configuration d'un module (Sidebar.showModuleConfig) : son identifiant section-ha est conservé. -->
    <div id="section-ha" class="content-section" style="display: none;">
      <app-config-form data-section="tech"></app-config-form>
    </div>

    <div id="section-applications-manager" class="content-section" style="display: none;">
      <app-applications-manager></app-applications-manager>
    </div>

    <div id="section-deployment" class="content-section" style="display: none;">
      <app-deployment-manager></app-deployment-manager>
    </div>
    <div id="section-post-install" class="content-section" style="display: none;">
      <app-post-install-manager></app-post-install-manager>
    </div>

    <!-- Container pour les modules dynamiques -->
    <div id="modules-container" class="content-section" style="display: none;">
      <app-module-container></app-module-container>
    </div>
  </main>

  <!-- ====================================================================== -->
  <!-- MODALE DES LOGS -->
  <!-- ====================================================================== -->
  <app-logs-modal></app-logs-modal>

  <!-- ====================================================================== -->
  <!-- SCRIPTS - Tous externes, chargement différé -->
  <!-- ====================================================================== -->
  
  <!-- Socket.io - Chargé en premier depuis CDN -->
  <script defer src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <!-- Alpine.js (vendorisé + bootstrap des stores, voir alpinejs-implementation_specs_v1.0.md).
       Doit rester une balise <script> classique (pas type="module") chargée avant app.js, pour
       que window.Alpine existe déjà quand app.js démarre (§3.3 de la spec). -->
  <script defer src="/vendor/alpine.js"></script>

  <!-- Bundle TypeScript compilé - Chargé après Socket.io et Alpine.js -->
  <script type="module" src="/js/ts/app.js"></script>
</body>
</html>
