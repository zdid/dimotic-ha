id: commit-push-docker
title: "Commit + push + tag + build Docker"
description: >-
  Saisir un titre (+ détail optionnel) de commit : ajoute tout, committe, pousse (rien à
  committer : passe directement à la suite). Case à cocher "construire Docker" : si cochée,
  COMPILE toutes les applications pour vérification (arrêt avant tout tag en cas d'échec), propose
  le prochain tag (mineur par défaut, ou patch/majeur — calculé depuis le plus haut vX.Y.Z du
  dépôt, modifiable), puis construit et publie l'image Docker Hub (--build-only, sans déployer sur
  aucune machine). Confirmations interactives avant chaque action irréversible. À lancer soi-même
  depuis un clone du dépôt.
filename: commit-push-docker.sh
requiresSudo: false
