id: tasmota-config
title: "Configurer un appareil Tasmota (à distance)"
description: >-
  Configure par le réseau un appareil Tasmota déjà connecté au Wi-Fi : seulement les variables à
  remplir, rien à saisir sur l'appareil. Affiche l'état actuel et les réglages prévus, demande
  confirmation, puis applique SYSTÉMATIQUEMENT l'installation standard : broker MQTT, Topic et
  FullTopic par site, DeviceName selon la convention de nommage, découverte Tasmota native, heure de
  France, position ; en option la mise à jour OTA et le modèle Sonoff Basic R4 avec Magic Switch.
  Vérifie à la fin que le nom n'est pas tronqué et que l'appareil est connecté au broker.
filename: tasmota-config.sh
requiresSudo: false
execution:
  machine: falbala_817412
  utilisateur: didier
  dossier: /home/didier
