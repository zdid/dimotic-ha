id: prepare-sd-card
title: "Préparer et écrire une carte SD/clé USB Raspberry Pi"
description: >-
  Toutes les questions au départ (WiFi compris), puis une seule pause pour choisir la carte —
  « q » pour s'arrêter là (image gardée, reprise directe au choix de la carte en relançant avec
  les mêmes réponses). Installés SYSTÉMATIQUEMENT dans une image de base préparée une fois dans
  qemu puis gardée en cache : Docker CE, /docker/dimotic-ha/ (non démarré), Node.js+npm+serialport+mqtt,
  mosquitto-clients, build-essential, SSH root (clé dimotic-ha). trixie-lite (cloud-init) par
  défaut, bookworm-lite possible.
filename: prepare-sd-card.sh
requiresSudo: true
