<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPLAN - Plans</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="styles.css">
  <!-- Les icônes des objets HA (BaseEntity.createIcon/createStatusIndicator, models/objects/**)
       utilisent des classes Font Awesome (<i class="fas fa-...">) — même dépendance que le
       client/public/index.html original de haplanserver, jamais reprise jusqu'ici. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { margin: 0; }
    .haplan-app { display: flex; flex-direction: column; height: 100vh; }
    .haplan-header {
      display: none; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
      background: var(--color-surface); border-bottom: 1px solid var(--color-primary);
    }
    .haplan-header.open { display: flex; }
    .haplan-header select {
      padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--color-primary);
      background: var(--color-bg); color: var(--color-text); color-scheme: dark;
    }
    .haplan-header a { color: var(--color-accent); text-decoration: none; }
    .haplan-body { position: relative; flex: 1; min-height: 0; }
    /* FloorPlan.ts::initContainer() force position:relative en style inline sur cet élément (pour
       servir de repère aux objets positionnés en absolu dessus) — donc on le remplit par
       width/height:100% plutôt que par inset, qui n'aurait aucun effet sur du position:relative. */
    #floorplan-container {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--color-bg);
    }
    .haplan-empty {
      display: flex; align-items: center; justify-content: center; height: 100%;
      color: var(--color-text-muted); font-size: 1.1em;
    }
    .haplan-header button {
      padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--color-primary);
      background: var(--color-bg); color: var(--color-text); cursor: pointer; font-size: 0.9em;
    }
    .haplan-header button.active { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    /* Contrôles discrets superposés au plan : retour + bascule du menu (voir 1) ci-dessus). Restent
       visibles que le menu soit ouvert ou fermé — seul le menu (.haplan-header) se replie. */
    .haplan-floating-controls {
      position: absolute; top: 12px; left: 12px; z-index: 60; display: flex; gap: 8px;
    }
    .haplan-icon-btn {
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: var(--color-surface); border: 1px solid var(--color-primary); color: var(--color-text);
      text-decoration: none; cursor: pointer; font-size: 1.1em; opacity: 0.8; transition: opacity 0.15s ease;
    }
    .haplan-icon-btn:hover { opacity: 1; }
    .haplan-icon-btn.active { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    /* Nom (taxonomie QUOI/OÙ) affiché brièvement au clic sur un objet en mode édition (voir 2) ) */
    .haplan-entity-label {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60;
      background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-primary);
      border-radius: var(--radius); padding: 6px 14px; font-size: 0.95em;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .haplan-entity-label.visible { opacity: 1; }
    /* Flèches épaisses de navigation entre plans (circulaire — voir setupFloorplanArrows() dans
       dashboard-app.ts), en remplacement pratique du sélecteur caché dans le menu replié. */
    .haplan-nav-arrow {
      position: absolute; top: 0; bottom: 0; width: 64px; z-index: 55;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--color-text);
      font-size: 3em; line-height: 1; cursor: pointer; opacity: 0.35;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .haplan-nav-arrow:hover { opacity: 0.9; background: rgba(0,0,0,0.15); }
    .haplan-nav-arrow--prev { left: 0; }
    .haplan-nav-arrow--next { right: 0; }
    /* Réglage de la taille des icônes/textes du plan (--plan-scale, voir styles.css et
       setupPlanScaleControl() dans dashboard-app.ts) — mémorisé par écran (localStorage), pas
       par utilisateur : un plan mural fixe garde le réglage qui lui convient. */
    .haplan-scale-panel {
      display: none; align-items: center; gap: 10px;
      position: absolute; top: 56px; left: 12px; z-index: 60;
      background: var(--color-surface); border: 1px solid var(--color-primary);
      border-radius: var(--radius); padding: 8px 14px;
    }
    .haplan-scale-panel.active { display: flex; }
    .haplan-scale-panel span {
      font-size: 0.85em; color: var(--color-text); min-width: 3em; text-align: right;
    }
    #entity-picker-panel {
      display: none; position: fixed; top: 0; right: 0; width: 340px; max-height: 100vh;
      overflow-y: auto; background: var(--color-surface); border-left: 1px solid var(--color-primary);
      padding: 16px; z-index: 500;
    }
    #entity-picker-panel.active { display: block; }
    #entity-picker-panel select {
      display: block; width: 100%; margin-bottom: 10px; padding: 6px 10px; border-radius: var(--radius);
      border: 1px solid var(--color-primary); background: var(--color-bg); color: var(--color-text); color-scheme: dark;
    }
    #new-floorplan-panel {
      display: none; position: fixed; top: 0; right: 0; width: 300px;
      background: var(--color-surface); border-left: 1px solid var(--color-primary);
      padding: 16px; z-index: 500;
    }
    #new-floorplan-panel.active { display: block; }
    #new-floorplan-panel input[type="text"] {
      display: block; width: 100%; margin-bottom: 10px; padding: 6px 10px; border-radius: var(--radius);
      border: 1px solid var(--color-primary); background: var(--color-bg); color: var(--color-text); box-sizing: border-box;
    }
    #new-floorplan-panel input[type="file"] { display: block; width: 100%; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="haplan-app">
    <div class="haplan-header" id="haplan-header">
      <strong>🗺️ Plans</strong>
      <select id="floorplan-select"></select>
      <button type="button" id="btn-edit-mode">✏️ Éditer</button>
      <button type="button" id="btn-add-entity">➕ Ajouter une entité</button>
      <button type="button" id="btn-new-floorplan">🆕 Nouveau plan</button>
      <button type="button" id="btn-delete-floorplan">🗑️ Supprimer ce plan</button>
      <button type="button" id="btn-deploy-floorplan">🖥️ Déployer sur l'écran</button>
      <span id="haplan-connection-status" style="margin-left:auto;font-size:0.85em;color:var(--color-text-muted);"></span>
    </div>
    <div class="haplan-body">
      <div class="haplan-floating-controls">
        <a href="/" class="haplan-icon-btn" title="Retour" aria-label="Retour">←</a>
        <button type="button" id="btn-toggle-menu" class="haplan-icon-btn" title="Menu" aria-label="Menu">☰</button>
        <button type="button" id="btn-toggle-scale" class="haplan-icon-btn" title="Taille icônes/textes" aria-label="Taille icônes/textes">🔍</button>
      </div>
      <div class="haplan-scale-panel" id="haplan-scale-panel">
        <input type="range" id="haplan-scale-range" min="0.6" max="1.2" step="0.1" value="1">
        <span id="haplan-scale-value">100%</span>
      </div>
      <button type="button" id="btn-floorplan-prev" class="haplan-nav-arrow haplan-nav-arrow--prev" title="Plan précédent" aria-label="Plan précédent">‹</button>
      <button type="button" id="btn-floorplan-next" class="haplan-nav-arrow haplan-nav-arrow--next" title="Plan suivant" aria-label="Plan suivant">›</button>
      <div id="floorplan-container" class="floorplan-drag-container"></div>
      <div id="haplan-entity-label" class="haplan-entity-label"></div>
    </div>
  </div>
  <div id="entity-picker-panel">
    <h3 style="margin-top:0;">Ajouter une entité</h3>
    <p style="color:var(--color-text-muted);font-size:0.85em;">Classée par lieu puis par type (taxonomie QUOI/OÙ).</p>
    <div id="entity-selector-container"></div>
  </div>
  <div id="new-floorplan-panel">
    <h3 style="margin-top:0;">Nouveau plan</h3>
    <form id="new-floorplan-form">
      <input type="text" id="new-floorplan-name" placeholder="Nom du plan" required>
      <input type="file" id="new-floorplan-file" accept="image/png,image/jpeg,image/webp" required>
      <button type="submit" class="btn-primary" style="width:100%;">Créer</button>
    </form>
  </div>

  <!-- Page de navigation complète, pas injectée dans le Shadow DOM du core — il lui faut sa
       propre copie du script socket.io (voir rfxcom/config.html, même pattern). -->
  <script defer src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script type="module" src="dashboard-app.js"></script>
</body>
</html>
