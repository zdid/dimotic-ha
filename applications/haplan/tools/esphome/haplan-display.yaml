# =============================================================================
# haplan-display.yaml — écran mural 800x480 (carte Sunton ESP32-8048S070) affichant
# un plan HAPLAN figé (image de fond) avec les icônes/valeurs des entités HA en direct.
#
# Pas de tactile/contrôle : lecture seule (cohérent avec "plan figé, états en direct").
#
# Prérequis avant de compiler :
# 1. Générer l'image + le fragment de widgets pour ton plan :
#      cd applications/haplan/tools && python3 generate_esphome_floorplan.py original
#    -> produit esphome/floorplan_original_800x480.png et esphome/floorplan_original.yaml
# 2. Copier le bloc sous "lvgl_widgets_fragment:" de floorplan_<id>.yaml dans la section
#    `lvgl: pages: - widgets:` ci-dessous (juste après `- image: ...`), et coller le bloc
#    `text_sensor:`/`sensor:` du même fichier à la racine de CE fichier (fusion manuelle
#    volontaire — évite un système d'include qui masquerait les erreurs de fusion).
# 3. Adapter `image: file:` ci-dessous au nom réel généré (floorplan_<id>_800x480.png).
#
# ⚠️ Pinout de l'écran RGB (section display ci-dessous) : celui communément publié pour les
# cartes Sunton ESP32-8048S0xx (7"/800x480, ESP32-S3) — À VÉRIFIER contre le sérigraphie/la
# documentation de TA carte avant de flasher (des révisions existent). Compile d'abord avec
# `esphome compile` pour repérer une éventuelle erreur avant de flasher.
#
# ⚠️ Syntaxe des widgets LVGL (composant ESPHome relativement récent, syntaxe qui évolue) :
# vérifier contre la doc ESPHome de la version installée si `esphome compile` échoue sur le
# bloc `lvgl:`.
# =============================================================================

esphome:
  name: haplan-display
  friendly_name: "Plan HAPLAN"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Connexion native à HA — permet aux composants `homeassistant_sensor`/`homeassistant_text_sensor`
# ci-dessous de suivre l'état de n'importe quelle entité par son entity_id, sans avoir à connaître
# le topic MQTT sous-jacent (généré par RFXCOM/AREXX/NOMMAGE/zigbee2mqtt selon la source réelle).
api:
  encryption:
    key: !secret api_encryption_key

logger:

# -----------------------------------------------------------------------------
# Écran RGB parallèle 800x480 — pinout communément publié pour Sunton ESP32-8048S0xx.
# -----------------------------------------------------------------------------
display:
  - platform: rpi_dpi_rgb
    id: main_lcd
    update_interval: never  # LVGL pilote les rafraîchissements, pas de polling périodique
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 42
    pclk_frequency: 16MHz
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [45, 48, 47, 21, 14]
      green: [5, 6, 7, 15, 16, 17]
      blue: [8, 3, 46, 9, 1]

# Rétroéclairage — GPIO2 est la broche communément publiée pour ces cartes, à vérifier aussi.
output:
  - platform: ledc
    pin: 2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Rétroéclairage écran"
    id: backlight
    restore_mode: ALWAYS_ON

# -----------------------------------------------------------------------------
# Image de fond — généré par generate_esphome_floorplan.py, voir prérequis en en-tête.
# Remplacer par le nom réel du fichier PNG produit.
# -----------------------------------------------------------------------------
image:
  - file: "floorplan_original_800x480.png"
    id: floorplan_bg
    type: RGB565

# -----------------------------------------------------------------------------
# text_sensor:/sensor: — COLLER ICI le contenu généré par generate_esphome_floorplan.py
# (un homeassistant_sensor/homeassistant_text_sensor par entité positionnée sur le plan).
# -----------------------------------------------------------------------------
# text_sensor:
#   ...

# sensor:
#   ...

lvgl:
  displays:
    - main_lcd
  pages:
    - id: floorplan_page
      widgets:
        - image:
            src: floorplan_bg
            x: 0
            y: 0
            width: 800
            height: 480
        # COLLER ICI le contenu de "lvgl_widgets_fragment:" (généré par le script) —
        # un rond (light/switch/cover/climate) ou une étiquette (sensor) par entité positionnée.
