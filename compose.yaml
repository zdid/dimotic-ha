# =============================================================================
# Dimotic-HA (dépôt git ws-ha, à renommer plus tard) — socle + applications métier.
# Image publiée sur Docker Hub : zdid2/dimotic-ha (amd64 + arm64, RPi 3/4/5 en 64 bits).
#
# Autosuffisant : `docker compose up -d` suffit — le code applicatif est construit
# pendant le build de l'image (voir Dockerfile), pas monté depuis l'hôte. Aucun
# clone git ni étape de build séparée n'est nécessaire sur la machine cible.
#
# Pas de volume nommé sur /app (retiré le 07/08/2026, voir Dockerfile pour le
# détail) : l'activation/désactivation d'application ne déplace plus aucun
# fichier (liste `disabledApps` dans data/core/config.yaml désormais), donc plus
# besoin d'un système de fichiers unique en écriture persistante pour /app — les
# couches de l'image + la couche conteneur éphémère habituelle suffisent, comme
# pour n'importe quelle image Docker sans état. `docker compose pull && up -d`
# (ou `--force-recreate`) suffit pour appliquer une nouvelle version.
# =============================================================================

services:
  app:
    build: .
    image: dimotic-ha:latest
    container_name: dimotic-ha
    restart: unless-stopped

    # Home Assistant et le broker MQTT tournent en localhost sur cette même machine
    # (data/core/config.yaml : ha.ws.host / ha.mqtt.host) — le mode réseau hôte les
    # rend joignables tels quels, sans toucher à la configuration existante ni
    # dupliquer MQTT/HA dans des conteneurs séparés. `ports:` est sans effet avec ce
    # mode et volontairement omis — voir le Dockerfile (EXPOSE) pour la liste des
    # ports réellement utilisés (8080 core, 49161 AREXX, 11434 ia).
    #
    # ⚠️ Port 11434 (ia, émulation Ollama pour l'intégration HA — voir
    # fonctionnelles-ia_specs) : si un vrai serveur Ollama tourne déjà sur cette
    # machine, les deux ne peuvent pas coexister sur le même port en mode réseau
    # hôte. Changer `ollamaHttpPort` dans data/ia/config.yaml (ex: 11435) le cas
    # échéant, sans quoi `ia` échouera à démarrer (port déjà utilisé).
    network_mode: host

    # Nécessaire pour que RFXCOM accède dynamiquement à /dev/ttyUSBx quel que soit
    # son numéro (voir le volume /dev ci-dessous — PortDetector, voir
    # fonctionnelles-rfxcom_specs §8.2, résout un lien stable /dev/serial/by-id vers
    # le device réel, qui peut changer de numéro d'un redémarrage/rebranchement à
    # l'autre). Alternative plus restrictive si le port ne change jamais sur cette
    # machine : remplacer `privileged`/le volume /dev par
    #   devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]
    #   group_add: ["dialout"]
    # — au prix de devoir éditer ce fichier à chaque changement de numérotation.
    privileged: true

    # L'image tourne avec l'utilisateur intégré `node` (uid/gid 1000, voir
    # Dockerfile) — coïncide avec le premier utilisateur par défaut de Raspberry Pi
    # OS et de la plupart des distributions Linux mono-utilisateur, donc les
    # fichiers écrits sur data/ et logs/ (volumes hôte) restent possédés par
    # l'utilisateur attendu sans configuration supplémentaire dans le cas courant.
    # Si l'hôte utilise un uid/gid différent pour son utilisateur principal,
    # décommenter et ajuster la ligne suivante (nécessaire pour que les fichiers
    # écrits sur data/ et logs/, bind-montés depuis l'hôte, restent possédés par
    # cet utilisateur) :
    #   user: "1000:1000"
    #
    # `dialout` nécessaire pour l'accès au port série sur un hôte où /dev/ttyUSBx
    # n'est pas world-writable (mode 660 propriétaire root:dialout, cas le plus
    # courant).
    group_add:
      - dialout

    environment:
      - TZ=Europe/Paris

    volumes:
      # Données/config persistantes (un sous-répertoire par application, voir
      # techniques-socle-ha-mqtt_specs §7) et logs — bind-mounts hôte pour rester
      # directement consultables/éditables sans passer par `docker exec`.
      - ./data:/app/data
      - ./logs:/app/logs
      # RFXCOM — voir le commentaire `privileged` ci-dessus.
      - /dev:/dev
